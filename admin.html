<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Gran Rifa</title><style>body{margin:0;background:#090909;color:#fff;font-family:system-ui;padding:16px}.wrap{max-width:760px;margin:auto}.card{background:#121212;border:1px solid #2c2c2c;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.n{padding:11px 3px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;font-weight:800}.n.on{background:#4a2020;border-color:#9a4a4a}input{width:100%;padding:12px;box-sizing:border-box;background:#0b0b0b;border:1px solid #333;border-radius:10px;color:#fff;margin:5px 0 10px}.action{width:100%;padding:13px;border:0;border-radius:11px;background:#f4c542;color:#111;font-weight:900;margin-top:8px}.muted{color:#aaa;font-size:13px;line-height:1.5}@media(min-width:600px){.grid{grid-template-columns:repeat(10,1fr)}}</style></head><body><div class="wrap"><h1>🔐 Administrador · Gran Rifa</h1><div class="card"><b>Control de números</b><p class="muted">Toca un número para marcarlo como vendido. Esta base guarda el estado en este dispositivo.</p><div id="grid" class="grid"></div></div><div class="card"><b>Resultados</b><p class="muted">Introduce los 5 números ganadores, en orden.</p><input id="w" placeholder="Ejemplo: 07, 23, 41, 58, 92" inputmode="numeric"><button class="action" onclick="save()">Guardar estado</button><button class="action" onclick="downloadData()">Exportar data.json</button></div><div class="card"><b>Resumen</b><div id="sum"></div></div></div><script>
let sold=new Set(JSON.parse(localStorage.getItem("rifa_sold")||"[]").map(x=>String(x).padStart(2,"0")));let winners=JSON.parse(localStorage.getItem("rifa_winners")||"[]");
function render(){let g=document.getElementById("grid");g.innerHTML="";for(let i=0;i<100;i++){let n=String(i).padStart(2,"0"),b=document.createElement("button");b.className="n"+(sold.has(n)?" on":"");b.textContent=n;b.onclick=()=>{sold.has(n)?sold.delete(n):sold.add(n);localStorage.setItem("rifa_sold",JSON.stringify([...sold]));render()};g.appendChild(b)}document.getElementById("sum").innerHTML=`Vendidos: <b>${sold.size}</b> · Disponibles: <b>${100-sold.size}</b> · Recaudado: <b>RD$${(sold.size*300).toLocaleString("es-DO")}</b>`}
function save(){let a=document.getElementById("w").value.split(",").map(x=>x.trim()).filter(Boolean).map(x=>String(parseInt(x,10)).padStart(2,"0")).filter(x=>/^\d\d$/.test(x));if(a.length!==5){alert("Coloca exactamente 5 números.");return}winners=a;localStorage.setItem("rifa_winners",JSON.stringify(winners));alert("Guardado.")}
function downloadData(){let blob=new Blob([JSON.stringify({sold:[...sold].sort(),winners},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="data.json";a.click();URL.revokeObjectURL(a.href)}
render();if(winners.length)document.getElementById("w").value=winners.join(", ");
</script></body></html>
